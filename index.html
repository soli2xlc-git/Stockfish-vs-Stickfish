<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockfish vs. Stockfish</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
  :root{
    --bg:#14161a; --panel:#1e2128; --text:#e8eaed; --muted:#9aa0aa;
    --light:#ead9b8; --dark:#a97c50; --hl:rgba(255,215,0,.45); --accent:#4cc38a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Roboto,sans-serif;
       display:flex;justify-content:center;padding:16px}
  .wrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:1000px;width:100%}
  h1{width:100%;text-align:center;margin:0 0 4px;font-size:1.6rem}
  .sub{width:100%;text-align:center;color:var(--muted);margin:0 0 8px}
  .left{flex:1 1 360px;max-width:560px}
  .right{flex:1 1 280px;max-width:380px;display:flex;flex-direction:column;gap:12px}
  .player{display:flex;justify-content:space-between;align-items:center;background:var(--panel);
          padding:8px 12px;border-radius:8px;margin:6px 0;font-weight:600}
  .player small{color:var(--muted);font-weight:400}
  .player.active{outline:2px solid var(--accent)}
  .boardwrap{display:flex;gap:8px}
  .evalbar{width:18px;background:#111;border-radius:6px;overflow:hidden;position:relative;border:1px solid #333}
  .evalfill{position:absolute;bottom:0;left:0;right:0;background:#f2f2f2;height:50%;transition:height .4s}
  .boardbox{flex:1;min-width:0;align-self:flex-start;aspect-ratio:1/1;position:relative;border-radius:6px;overflow:hidden}
  .board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr))}
  .sq{aspect-ratio:1/1;min-width:0;min-height:0;overflow:hidden;position:relative}
  .pieces{position:absolute;inset:0;pointer-events:none}
  .pc{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;line-height:1;z-index:2}
  .pc.moving{transition:left .45s ease-in-out,top .45s ease-in-out;z-index:6}
  .pc.gone{transition:transform .35s ease-in,opacity .35s ease-in;transform:scale(.2) rotate(50deg);opacity:0;z-index:3}
  .sq.cap::before{content:"";position:absolute;inset:0;background:rgba(225,40,40,.65);animation:capflash .9s ease-out forwards;z-index:1}
  @keyframes capflash{from{opacity:1}to{opacity:0}}
  .pc.fallen{transform-origin:50% 88%;animation:kingfall 1.1s cubic-bezier(.45,0,.85,.55) forwards;z-index:7}
  @keyframes kingfall{0%{transform:rotate(0)}65%{transform:rotate(98deg)}80%{transform:rotate(80deg)}92%{transform:rotate(92deg)}100%{transform:rotate(88deg) translateY(8%)}}
  .sq.mate{background:#c0392b !important}
  .tray{display:flex;align-items:center;flex-wrap:wrap;flex:1;min-width:0;margin:0 8px;min-height:1.4em}
  .tp{font-size:1.15rem;line-height:1;margin-right:-4px}
  .tray .b{color:#111;text-shadow:0 0 2px #fff,0 0 2px #fff}
  .diff{font-size:.8rem;color:var(--muted);margin-left:8px;font-weight:600}
  .lastmove{line-height:1.5;font-size:.95rem}
  .lastmove .capt{color:#ff8a80;font-weight:700}
  .lastmove .chk{color:#ffd54f;font-weight:700}
  .sq.l{background:var(--light)} .sq.d{background:var(--dark)}
  .sq.hl::after{content:"";position:absolute;inset:0;background:var(--hl)}
  .sq span{position:relative;z-index:1}
  .w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 3px #000}
  .b{color:#111;text-shadow:0 0 1px rgba(255,255,255,.4)}
  .coord{position:absolute;font-size:10px;opacity:.6;z-index:2;color:#000}
  .coord.r{top:2px;left:3px} .coord.f{bottom:1px;right:3px}
  .card{background:var(--panel);border-radius:10px;padding:12px}
  .card h3{margin:0 0 8px;font-size:.95rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .status{font-size:1.05rem;font-weight:600;min-height:1.4em}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{background:#2b303a;color:var(--text);border:0;border-radius:8px;padding:9px 14px;font-size:.95rem;cursor:pointer}
  button:hover{background:#363c48} button.primary{background:var(--accent);color:#06210f;font-weight:700}
  label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);margin-top:8px}
  input[type=range]{width:100%}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .moves{max-height:230px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:.9rem;
         display:grid;grid-template-columns:34px 1fr 1fr;gap:2px 6px}
  .moves .n{color:var(--muted)}
  .moves .cur{background:#3a4152;border-radius:3px}
  .check{display:flex;flex-direction:row;align-items:center;gap:8px}
  .score{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <h1>♟ Stockfish vs. Stockfish</h1>
  <p class="sub">Zwei Schach-Engines spielen gegeneinander – du schaust zu.</p>

  <div class="left">
    <div class="player" id="pBlack"><span>⚫ Stockfish Schwarz <small id="lvB"></small></span><span class="tray" id="trayB"></span><span class="score" id="evB"></span></div>
    <div class="boardwrap">
      <div class="evalbar"><div class="evalfill" id="evalFill"></div></div>
      <div class="boardbox" id="boardbox"><div class="board" id="board"></div><div class="pieces" id="pieces"></div></div>
    </div>
    <div class="player" id="pWhite"><span>⚪ Stockfish Weiß <small id="lvW"></small></span><span class="tray" id="trayW"></span><span class="score" id="evW"></span></div>
  </div>

  <div class="right">
    <div class="card">
      <h3>Status</h3>
      <div class="status" id="status">Lade Engines …</div>
    </div>

    <div class="card">
      <h3>Letzter Zug</h3>
      <div class="lastmove" id="lastmove">–</div>
    </div>

    <div class="card">
      <h3>Steuerung</h3>
      <div class="btns">
        <button class="primary" id="btnPlay">⏸ Pause</button>
        <button id="btnNew">↻ Neue Partie</button>
      </div>
      <label>Tempo (Pause zwischen den Zügen): <b id="delayVal">0,8 s</b>
        <input type="range" id="delay" min="0" max="3000" step="100" value="800">
      </label>
      <label>Bedenkzeit pro Zug: <b id="thinkVal">300 ms</b>
        <input type="range" id="think" min="50" max="3000" step="50" value="300">
      </label>
      <label>Abwechslung – Chance auf den 2.-besten Zug: <b id="varVal">25 %</b>
        <input type="range" id="variety" min="0" max="60" step="5" value="25">
      </label>
      <div class="row">
        <label>Stärke Weiß: <b id="skW">20</b>
          <input type="range" id="skillW" min="0" max="20" value="20">
        </label>
        <label>Stärke Schwarz: <b id="skB">20</b>
          <input type="range" id="skillB" min="0" max="20" value="20">
        </label>
      </div>
      <label class="check"><input type="checkbox" id="auto" checked> Nach Partieende automatisch neu starten</label>
      <div style="margin-top:8px;color:var(--muted);font-size:.85rem">Stärke 0 = sehr schwach, 20 = volle Stärke.</div>
    </div>

    <div class="card">
      <h3>Züge</h3>
      <div class="moves" id="moves"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const SF_URL = "https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js";
  const PIECES = {
    w:{k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"},
    b:{k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"}
  };
  const VS = "\uFE0E";

  const $ = id => document.getElementById(id);
  const boardEl = $("board");

  let game = new Chess();
  let history = [];      // {san, from, to}
  let paused = false;
  let running = false;
  let thinking = false;
  let gen = 0;           // invalidates stale engine answers after reset
  let lastEval = {w:null,b:null};

  // ---------- Engines ----------
  function spawn(strategy){
    return new Promise((resolve,reject)=>{
      let w;
      const t=setTimeout(()=>{try{w&&w.terminate();}catch(e){} reject(new Error("Zeitüberschreitung ("+strategy+")"));},15000);
      const go=src=>{
        try{ w=new Worker(URL.createObjectURL(new Blob([src],{type:"application/javascript"}))); }
        catch(e){ clearTimeout(t); return reject(e); }
        w.onerror=ev=>{ console.error("Worker-Fehler", strategy, ev); clearTimeout(t); reject(new Error((ev&&ev.message)||("Worker-Fehler ("+strategy+")"))); };
        w.onmessage=e=>{ const l=typeof e.data==="string"?e.data:""; if(l.indexOf("uciok")>=0){ clearTimeout(t); resolve(w); } };
        w.postMessage("uci");
      };
      if(strategy==="fetch"){
        fetch(SF_URL).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); }).then(go).catch(e=>{ clearTimeout(t); reject(e); });
      } else {
        go('importScripts("'+SF_URL+'");');
      }
    });
  }

  async function makeEngine(name){
    let worker, errs=[];
    for(const strat of ["import","fetch"]){
      try{ worker = await spawn(strat); break; }
      catch(e){ errs.push(strat+": "+e.message); }
    }
    if(!worker) throw new Error(errs.join(" | "));
    const eng = {name, worker, ready:false, listeners:[]};
    worker.onerror = null;
    worker.onmessage = e => {
      const line = typeof e.data === "string" ? e.data : (e.data && e.data.data) || "";
      eng.listeners.slice().forEach(fn => fn(line));
    };
    eng.send = cmd => worker.postMessage(cmd);
    eng.once = (test, cb) => {
      const fn = line => { if(test(line)){ eng.listeners = eng.listeners.filter(x=>x!==fn); cb(line);} };
      eng.listeners.push(fn);
    };
    return eng;
  }

  function initEngine(eng, skill){
    return new Promise(res => {
      eng.send("setoption name Skill Level value " + skill);
      eng.send("setoption name MultiPV value 2");
      eng.send("isready");
      eng.once(l => l.indexOf("readyok")>=0, () => { eng.ready = true; res(); });
    });
  }

  // ---------- Eingebaute Notfall-Engine (läuft ohne Worker) ----------
  const PV={p:100,n:320,b:330,r:500,q:900,k:0};
  function evalWhite(g){
    const b=g.board(); let s=0;
    for(let r=0;r<8;r++)for(let f=0;f<8;f++){
      const p=b[r][f]; if(!p) continue;
      let v=PV[p.type];
      const cen=3.5-Math.max(Math.abs(f-3.5),Math.abs(r-3.5));
      if(p.type==="n"||p.type==="b") v+=cen*8;
      if(p.type==="q") v+=cen*2;
      if(p.type==="p"){ const adv=p.color==="w"?(6-r):(r-1); v+=adv*8+(f>=2&&f<=5?cen*3:0); }
      s+=p.color==="w"?v:-v;
    }
    return s;
  }
  function orderMoves(ms){
    return ms.sort((a,b)=>{
      const sa=(a.captured?PV[a.captured]*10-PV[a.piece]:0)+(a.promotion?800:0);
      const sb=(b.captured?PV[b.captured]*10-PV[b.piece]:0)+(b.promotion?800:0);
      return sb-sa;
    });
  }
  function negamax(g,depth,alpha,beta){
    if(g.in_checkmate()) return -30000-depth;
    if(g.in_draw()||g.in_stalemate()||g.insufficient_material()) return 0;
    if(depth===0) return (g.turn()==="w"?1:-1)*evalWhite(g);
    const ms=orderMoves(g.moves({verbose:true}));
    let best=-Infinity;
    for(const m of ms){
      g.move(m);
      const v=-negamax(g,depth-1,-beta,-alpha);
      g.undo();
      if(v>best) best=v;
      if(best>alpha) alpha=best;
      if(alpha>=beta) break;
    }
    return best;
  }
  function builtinMove(eng,fen){
    return new Promise(res=>setTimeout(()=>{
      const g=new Chess(fen);
      const sk=eng.skill;
      const depth = sk<5?1 : sk<12?2 : 3;
      const noise = (20-sk)*12;
      const ms=orderMoves(g.moves({verbose:true}));
      if(!ms.length) return res({move:"(none)",score:null});
      const scored=[];
      let best2=-Infinity, best1=-Infinity;
      for(const m of ms){
        g.move(m);
        const v=-negamax(g,depth-1,-Infinity,noise?Infinity:-best2);
        g.undo();
        scored.push({m,v,vn:v+(noise?(Math.random()-0.5)*noise*2:0)});
        if(!noise){
          if(v>best1){ best2=best1; best1=v; } else if(v>best2){ best2=v; }
        }
      }
      scored.sort((a,b)=>b.vn-a.vn);
      let pick=scored[0];
      const second=scored[1];
      const alt=pickVariation(
        {score:{type:"cp",v:pick.v}},
        second?{score:{type:"cp",v:second.v}}:null);
      if(alt) pick=second;
      const cp=Math.max(-2000,Math.min(2000,Math.round(pick.v)));
      res({move:pick.m.from+pick.m.to+(pick.m.promotion||""),score:{type:"cp",v:cp}});
    },20));
  }
  function makeBuiltin(name){ return {name,builtin:true,ready:true,skill:20,listeners:[]}; }

  // Wählt mit einer gewissen Chance den 2.-besten Zug, wenn er fast so gut ist
  function pickVariation(best, second){
    const chance = parseInt($("variety").value,10) / 100;
    if(!best || !second || Math.random() >= chance) return null;
    if(best.score.type!=="cp" || second.score.type!=="cp") return null;   // Matt-Züge nie auslassen
    if(Math.abs(best.score.v) > 600) return null;                          // klare Stellung: bester Zug
    if(best.score.v - second.score.v > 70) return null;                    // 2. Zug darf max. ~0,7 Bauern schlechter sein
    return second;
  }

  function askMove(eng, fen, ms){
    if(eng.builtin) return builtinMove(eng,fen);
    return new Promise(res => {
      const pv = {};
      const fn = line => {
        if(line.indexOf("info")===0){
          if(line.indexOf("lowerbound")>=0 || line.indexOf("upperbound")>=0) return;
          const sc = line.match(/score (cp|mate) (-?\d+)/);
          const mv = line.match(/ pv (\S+)/);
          if(!sc || !mv) return;
          const mp = line.match(/multipv (\d+)/);
          pv[mp ? mp[1] : "1"] = {move: mv[1], score:{type:sc[1], v:parseInt(sc[2],10)}};
        } else if(line.indexOf("bestmove")===0){
          eng.listeners = eng.listeners.filter(x=>x!==fn);
          const bm = line.split(" ")[1];
          let out = {move: bm, score: pv["1"] ? pv["1"].score : null};
          const alt = (pv["1"] && pv["1"].move===bm) ? pickVariation(pv["1"], pv["2"]) : null;
          if(alt) out = {move: alt.move, score: alt.score};
          res(out);
        }
      };
      eng.listeners.push(fn);
      eng.send("position fen " + fen);
      eng.send("go movetime " + ms);
    });
  }

  let engW, engB;

  // ---------- Board ----------
  const ANIM = 450;
  const piecesEl = $("pieces");
  const NAMES = {p:"Bauer",n:"Springer",b:"Läufer",r:"Turm",q:"Dame",k:"König"};
  const VAL = {p:1,n:3,b:3,r:5,q:9};
  let pcEls = {};

  function placePc(el, sq){
    const f = "abcdefgh".indexOf(sq[0]), r = 8 - parseInt(sq[1],10);
    el.style.left = (f*12.5) + "%";
    el.style.top = (r*12.5) + "%";
    el.dataset.sq = sq;
  }
  function sizePieces(){ piecesEl.style.fontSize = (boardEl.clientWidth/8*0.78) + "px"; }
  window.addEventListener("resize", sizePieces);

  function renderBoard(){
    boardEl.innerHTML = ""; piecesEl.innerHTML = ""; pcEls = {};
    const b = game.board();
    const last = history.length ? history[history.length-1] : null;
    for(let r=0;r<8;r++){
      for(let f=0;f<8;f++){
        const sqName = "abcdefgh"[f] + (8-r);
        const d = document.createElement("div");
        d.className = "sq " + ((r+f)%2===0 ? "l":"d");
        if(last && (last.from===sqName || last.to===sqName)) d.classList.add("hl");
        if(last && last.captured && last.to===sqName) d.classList.add("cap");
        if(f===0){ const c=document.createElement("i"); c.className="coord r"; c.style.fontStyle="normal"; c.textContent=8-r; d.appendChild(c); }
        if(r===7){ const c=document.createElement("i"); c.className="coord f"; c.style.fontStyle="normal"; c.textContent="abcdefgh"[f]; d.appendChild(c); }
        boardEl.appendChild(d);
        const p = b[r][f];
        if(p){
          const el = document.createElement("div");
          el.className = "pc " + p.color;
          el.textContent = PIECES[p.color][p.type] + VS;
          placePc(el, sqName);
          piecesEl.appendChild(el);
          pcEls[sqName] = el;
        }
      }
    }
    sizePieces();
  }

  // Figuren gleiten lassen; geschlagene Figur schrumpft weg
  function animateMove(m){
    return new Promise(res => {
      const el = pcEls[m.from];
      if(!el) return res();
      const fl = m.flags;
      let capEl = null;
      if(m.captured){
        const capSq = fl.indexOf("e")>=0 ? m.to[0]+m.from[1] : m.to;
        capEl = pcEls[capSq] || null;
      }
      let rookEl = null, rookTo = null;
      if(fl.indexOf("k")>=0 || fl.indexOf("q")>=0){
        const rank = m.from[1], kings = fl.indexOf("k")>=0;
        rookEl = pcEls[(kings?"h":"a")+rank];
        rookTo = (kings?"f":"d")+rank;
      }
      el.classList.add("moving");
      if(rookEl) rookEl.classList.add("moving");
      void el.offsetWidth;
      placePc(el, m.to);
      if(rookEl) placePc(rookEl, rookTo);
      if(capEl) setTimeout(()=>capEl.classList.add("gone"), ANIM*0.55);
      setTimeout(res, ANIM + 150);
    });
  }

  function kingFall(){
    const loser = game.turn();
    const b = game.board();
    for(let r=0;r<8;r++)for(let f=0;f<8;f++){
      const p=b[r][f];
      if(p && p.type==="k" && p.color===loser){
        const sq="abcdefgh"[f]+(8-r);
        const el=pcEls[sq];
        if(el) el.classList.add("fallen");
        const sqEl=boardEl.children[r*8+f];
        if(sqEl) sqEl.classList.add("mate");
      }
    }
  }

  function describeMove(h){
    const who = h.color==="w" ? "Weiß" : "Schwarz";
    const opp = h.color==="w" ? "Schwarz" : "Weiß";
    let t = "<b>" + who + ":</b> " + NAMES[h.piece] + " " + h.from + " → " + h.to;
    if(h.flags.indexOf("k")>=0) t += "<br>Kurze Rochade";
    if(h.flags.indexOf("q")>=0) t += "<br>Lange Rochade";
    if(h.captured){
      const sq = h.flags.indexOf("e")>=0 ? h.to[0]+h.from[1] : h.to;
      t += '<br><span class="capt">schlägt ' + (opp==="Weiß"?"weißen ":"schwarzen ") + NAMES[h.captured] + " auf " + sq +
           (h.flags.indexOf("e")>=0 ? " (en passant)" : "") + "</span>";
    }
    if(h.promotion) t += "<br>Umwandlung in " + NAMES[h.promotion];
    if(h.san.slice(-1)==="#") t += '<br><span class="chk">Schachmatt!</span>';
    else if(h.san.slice(-1)==="+") t += '<br><span class="chk">Schach!</span>';
    return t;
  }

  function renderCaptured(){
    const caps = {w:[], b:[]};
    history.forEach(h => { if(h.captured) caps[h.color].push(h.captured); });
    const order = ["q","r","b","n","p"];
    const sum = l => l.reduce((a,t)=>a+VAL[t],0);
    ["w","b"].forEach(c => {
      const opp = c==="w" ? "b" : "w";
      const list = caps[c].slice().sort((a,b)=>order.indexOf(a)-order.indexOf(b));
      const diff = sum(caps[c]) - sum(caps[opp]);
      const el = $(c==="w" ? "trayW" : "trayB");
      el.innerHTML = "";
      list.forEach(t => {
        const sp = document.createElement("span");
        sp.className = "tp " + opp;
        sp.textContent = PIECES[opp][t] + VS;
        el.appendChild(sp);
      });
      if(diff>0){ const d=document.createElement("b"); d.className="diff"; d.textContent="+"+diff; el.appendChild(d); }
    });
  }

  function renderMoves(){
    const el = $("moves");
    el.innerHTML = "";
    for(let i=0;i<history.length;i+=2){
      const n = document.createElement("div"); n.className="n"; n.textContent = (i/2+1)+".";
      el.appendChild(n);
      [i,i+1].forEach(j=>{
        const c = document.createElement("div");
        if(history[j]){ c.textContent = history[j].san; if(history[j].captured) c.style.color="#ff8a80"; if(j===history.length-1) c.classList.add("cur"); }
        el.appendChild(c);
      });
    }
    el.parentElement.scrollTop = el.parentElement.scrollHeight;
    el.scrollTop = el.scrollHeight;
  }

  function fmtScore(s, color){
    // s is from the perspective of the side that moved; convert to white's view
    if(!s) return null;
    const sign = color==="w" ? 1 : -1;
    return {type:s.type, v:s.v*sign};
  }
  function showEval(s){
    if(!s){ return; }
    let txt, pct;
    if(s.type==="mate"){
      txt = (s.v>0?"+":"-") + "M" + Math.abs(s.v);
      pct = s.v>0 ? 100 : 0;
    } else {
      txt = (s.v>0?"+":"") + (s.v/100).toFixed(2);
      pct = 50 + 50*(2/(1+Math.exp(-s.v/250))-1);
    }
    $("evalFill").style.height = pct + "%";
    $("evW").textContent = s.v>=0 ? txt : "";
    $("evB").textContent = s.v<0 ? txt : "";
  }

  function setActive(){
    $("pWhite").classList.toggle("active", game.turn()==="w" && !game.game_over());
    $("pBlack").classList.toggle("active", game.turn()==="b" && !game.game_over());
  }

  function endText(){
    if(game.in_checkmate()) return "Schachmatt! " + (game.turn()==="w" ? "Schwarz" : "Weiß") + " gewinnt.";
    if(game.in_stalemate()) return "Patt – Unentschieden.";
    if(game.insufficient_material()) return "Remis durch unzureichendes Material.";
    if(game.in_threefold_repetition()) return "Remis durch dreifache Stellungswiederholung.";
    if(game.in_draw()) return "Remis (50-Züge-Regel).";
    return null;
  }

  // ---------- Game loop ----------
  async function step(){
    if(thinking || paused || !running) return;
    const over = endText();
    if(over || history.length > 400){
      $("status").textContent = over || "Remis (Zuglimit).";
      setActive();
      if($("auto").checked){ const g=gen; setTimeout(()=>{ if(g===gen) newGame(); }, 6000); }
      return;
    }
    thinking = true;
    const myGen = gen;
    const color = game.turn();
    const eng = color==="w" ? engW : engB;
    $("status").textContent = (color==="w" ? "Weiß" : "Schwarz") + " denkt nach …";
    setActive();

    const res = await askMove(eng, game.fen(), parseInt($("think").value,10));
    if(myGen !== gen){ thinking = false; return; }   // game was reset meanwhile

    const mv = res.move;
    if(!mv || mv==="(none)"){ thinking=false; $("status").textContent = endText() || "Keine Züge mehr."; return; }
    const made = game.move({from:mv.slice(0,2), to:mv.slice(2,4), promotion: mv[4]});
    if(!made){ thinking=false; $("status").textContent="Ungültiger Zug von der Engine – Partie neu starten."; return; }
    const entry = {san:made.san, from:made.from, to:made.to, piece:made.piece, color:made.color,
                   captured:made.captured||null, promotion:made.promotion||null, flags:made.flags};
    history.push(entry);
    showEval(fmtScore(res.score, color));
    $("lastmove").innerHTML = describeMove(entry);
    renderMoves(); renderCaptured();
    $("status").textContent = (color==="w" ? "Weiß" : "Schwarz") + " zieht …";
    await animateMove(made);
    if(myGen !== gen) return;
    renderBoard();
    if(game.in_checkmate()) kingFall();
    thinking = false;

    const over2 = endText();
    $("status").textContent = over2 || ((game.turn()==="w" ? "Weiß" : "Schwarz") + " ist am Zug");
    setActive();
    setTimeout(step, parseInt($("delay").value,10));
  }

  function newGame(){
    gen++;
    thinking = false;
    game = new Chess();
    history = [];
    $("evalFill").style.height = "50%";
    $("evW").textContent = ""; $("evB").textContent = "";
    renderBoard(); renderMoves(); renderCaptured(); $("lastmove").textContent = "–"; setActive();
    $("status").textContent = "Weiß ist am Zug";
    setTimeout(step, 500);
  }

  // ---------- UI ----------
  function fmtSec(ms){ return (ms/1000).toFixed(1).replace(".",",") + " s"; }
  $("delay").oninput = e => $("delayVal").textContent = fmtSec(+e.target.value);
  $("variety").oninput = e => $("varVal").textContent = e.target.value + " %";
  $("think").oninput = e => $("thinkVal").textContent = e.target.value + " ms";
  function setSkill(eng, v){ if(!eng) return; if(eng.builtin){ eng.skill=+v; } else if(eng.ready){ eng.send("setoption name Skill Level value " + v); } }
  $("skillW").oninput = e => { $("skW").textContent = e.target.value; $("lvW").textContent = "(Stufe "+e.target.value+")"; setSkill(engW, e.target.value); };
  $("skillB").oninput = e => { $("skB").textContent = e.target.value; $("lvB").textContent = "(Stufe "+e.target.value+")"; setSkill(engB, e.target.value); };
  $("lvW").textContent = "(Stufe 20)"; $("lvB").textContent = "(Stufe 20)";

  $("btnPlay").onclick = () => {
    paused = !paused;
    $("btnPlay").textContent = paused ? "▶ Weiter" : "⏸ Pause";
    if(!paused) step();
    else $("status").textContent = "Pausiert";
  };
  $("btnNew").onclick = newGame;

  // ---------- Start ----------
  renderBoard();
  (async function(){
    $("status").textContent = "Lade Stockfish … (kann beim ersten Mal ein paar Sekunden dauern)";
    try{
      engW = await makeEngine("white");
      engB = await makeEngine("black");
      await Promise.all([initEngine(engW, 20), initEngine(engB, 20)]);
      $("status").textContent = "Stockfish bereit – los geht's!";
    }catch(err){
      console.error(err);
      try{ engW&&engW.worker&&engW.worker.terminate(); engB&&engB.worker&&engB.worker.terminate(); }catch(e){}
      engW = makeBuiltin("white"); engB = makeBuiltin("black");
      engW.skill = +$("skillW").value; engB.skill = +$("skillB").value;
      $("lvW").textContent = "(Notfall-Engine)"; $("lvB").textContent = "(Notfall-Engine)";
      $("status").textContent = "Stockfish ließ sich in diesem Browser nicht starten – es spielt die eingebaute Notfall-Engine.";
      alert("Stockfish konnte nicht geladen werden (" + err.message + ").\nEs spielt stattdessen eine einfache eingebaute Engine.");
    }
    running = true;
    setTimeout(step, 1200);
  })();
})();
</script>
</body>
</html>
